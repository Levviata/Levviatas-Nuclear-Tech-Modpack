##########################################################################################################
# 6_gameplay_messages
#--------------------------------------------------------------------------------------------------------#
# Gameplay feedback messages.
##########################################################################################################

6_gameplay_messages {
    # [Server-side] Triggers above 10 limit increases
    S:aug10=SPECIAL limit++

    # [Server-side] Triggers above 20 increases
    S:aug20=Limit++

    # [Server-side] Triggers above 5 stat limit increases
    S:aug5=Augmented SPECIAL limit by one

    # [Server-side] Single message with no variety
    S:augLimitMessage=Augmented SPECIAL limit by one

    # [Server-side] Triggers under 5 stat limit increases
    S:augUnder5=Augmented my SPECIAL limit by one, cool

    # [Server-side] Show hotbar messages
    B:hotbarMessages=true

    # [Server-side] Stat limit reached message
    S:limitMessage=I have reached my limit, I cant consume more.

    # [Server-side] Use varied messages when increment stat limit
    B:variedAugLimitMessages=true
}


