# Configuration file

##########################################################################################################
# 1_special_stats
#--------------------------------------------------------------------------------------------------------#
# LSPECIAL mod configuration.
##########################################################################################################

1_special_stats {
    # [Server-side] Enable Agility
    B:agility=true

    # [Server-side] Enable Charisma
    B:charisma=true

    # [Server-side] Enable Charisma bonus
    B:charismaBonus=true

    # [Server-side] Enable Endurance
    B:endurance=true

    # [Server-side] Enable Endurance bonus
    B:enduranceBonus=true

    # [Server-side] Hide disabled stats in stats screen, false shows them as strike-through
    B:hideDisabledStats=true

    # [Server-side] Intelligence level 5 perk. Held damageable items do not lose durability
    B:infiniteItemDurability=true

    # [Server-side] Enable Intelligence
    B:intelligence=true

    # [Server-side] Enable Luck
    B:luck=true

    # [Server-side] Enable Perception
    B:perception=true

    # [Server-side] Enforce stat limit
    B:statLimit=true

    # [Server-side] Enable Strength
    B:strength=true
}


##########################################################################################################
# 2_bobbleheads_consumption
#--------------------------------------------------------------------------------------------------------#
# Bobblehead item behavior and stat progression.
##########################################################################################################

2_bobbleheads_consumption {
    # [Server-side] Give bobbleheads their stats in their display name
    B:rename=true

    # [Server-side] Points per bobblehead
    I:statsPerBobblehead=1
}


##########################################################################################################
# 3_guns_ammo
#--------------------------------------------------------------------------------------------------------#
# Gun mechanics, perks, ammunition and durability.
##########################################################################################################

3_guns_ammo {
    # [Server-side] Use the nerfed delay formula for guns that use buckshot (shotguns)
    B:buckshotDelayNerf=true

    # [Server-side] Comma separated list of hbm:ammo_standard but ONLY with the Metadata. Also supports hbm:ammo_secret:Metadata
    S:buckshotGaugeList=41,42,43,44,45,46,47,48,49,78,79,80,81,84,hbm:ammo_secret:3

    # [Server-side] INFINITE_AT_INTELLIGENCE_5, PERCENT_REDUCTION, FORMULA
    S:gunWearMode=INFINITE_AT_INTELLIGENCE_5

    # [Server-side] Wear reduction per Intelligence point
    D:gunWearReductionPerIntelligence=0.05

    # [Server-side] Master switch for gun modifications. Whether to modify Nuclear Tech guns at all.
    B:modifyGuns=true

    # [Server-side] Enable Pepperbox lesser perk
    B:pepperboxLesserPerk=true

    # [Server-side] Validated expression; variable: luck
    S:refundAmmoFormula=min(luck * 0.05, 0.5)

    # [Server-side] Enable magazine refunds
    B:refundMagazines=true

    # [Server-side] Enable Intelligence revolver perk
    B:revolverHigherPerk=true

    # [Server-side] Comma separated list of ModID:ItemID
    S:revolverList=hbm:gun_flaregun,hbm:gun_heavy_revolver,hbm:gun_light_revolver_atlas,hbm:gun_light_revolver
}


##########################################################################################################
# 4_potions_effects
#--------------------------------------------------------------------------------------------------------#
# Potion duration values are measured in ticks.
##########################################################################################################

4_potions_effects {
    # [Server-side] Endurance level 5 perk. Enable amplified regeneration.
    B:amplifiedRegeneration=true

    # [Server-side] Resistance amplifier
    I:charismaPotionAmplifier=0

    # [Server-side] Regeneration amplifier bonus
    I:endurancePotionAmplifier=1

    # [Server-side] Potion duration in ticks. Default value is 5~ seconds
    I:potionTimeTicks=115

    # [Server-side] Amplifier bonus
    D:regenAmplifierBonus=1.0

    # [Server-side] Whether to amplify existing regeneration or not. Might fix issues with other mods
    B:respectHigherRegenAmplifier=false
}


