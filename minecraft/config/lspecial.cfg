##########################################################################################################
# 9_advanced
#--------------------------------------------------------------------------------------------------------#
# Arithmetic expressions support + - * / %, parentheses, variables, min/max/abs/sqrt/floor/ceil/round.
##########################################################################################################

9_advanced {
    # [Server-side] Variables: agility
    S:agilityFormula=agility * 0.075

    # [Server-side] Variables: charisma
    S:armorFormula=charisma * 2.0

    # [Server-side] Variables: charisma
    S:armorToughnessFormula=charisma * 0.5

    # [Server-side] Variables: strength
    S:attackDamageFormula=strength

    # [Server-side] Variables: intelligence, originalDelay; floor preserves the original integer step
    S:bonusDelayFormula=floor(intelligence / 10)

    # [Server-side] Variables: intelligence, originalDelay
    S:buckshotDelayFormula=originalDelay - floor(intelligence / 100)

    # [Server-side] Variables: endurance
    S:enduranceFormula=endurance

    # [Server-side] Variables: intelligence, originalWear; output is reduction fraction
    S:gunWearFormula=min(intelligence * 0.05, 0.75)

    # [Server-side] Variables: perception, originalDamage
    S:perceptionGunDamageFormula=perception
}


